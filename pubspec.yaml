name: sudo_cash
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Platform support
  path_provider: ^2.1.2
  path_provider_linux: ^2.1.0

  # SQLite support
  sqflite: ^2.0.0+4                     # For Android
  sqflite_common_ffi: ^2.3.0            # For Linux, Windows, macOS
  sqlite3_flutter_libs: ^0.5.13         # Required for desktop platforms

  fluttertoast: ^8.0.0
  path: ^1.8.0
  intl: ^0.20.2
  provider: ^6.0.0
  url_launcher: ^6.0.0
  window_size: ^0.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_logo_resized.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/login_image.png
    - assets/images/welcome.png
    - assets/images/sun.png
    - assets/images/moon_2.jpg
    - assets/images/morning.png
    - assets/images/moon_sleep.jpg
    - assets/images/good_night.jpg
    - assets/images/sleeping.jpg
    - assets/images/good_sun.png
    - assets/images/afternoon.jpg
    - assets/images/morning_bg.png
    - assets/images/wakeUp.png
    - assets/images/background.jpg
    - assets/images/wakeUp2.png
    - assets/images/morning_bg5.png

  fonts:
    - family: Sora
      fonts:
        - asset: assets/fonts/Sora.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
